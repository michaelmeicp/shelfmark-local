<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f6f1"><title>Shelfmark｜讀看清單</title><link rel="stylesheet" href="./styles.css"></head>
<body><a href="#library" class="skip">跳到作品庫</a><header class="mast"><a href="./" class="brand"><svg width="29" height="27" viewBox="0 0 29 27" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 3v21M9 3v21M15 3v21M19 4l6 19"/></svg> Shelfmark</a><span class="local">● 僅儲存於此裝置</span></header>
<main><p class="eyebrow">THE PERSONAL SHELF　/　私人收藏誌</p><h1>讀看清單</h1><p class="intro">書頁、銀幕與每一集，把想看的、看過的收在同一處。</p><div class="stats" id="stats"></div>
<nav class="tabs" aria-label="主要檢視"><button data-tab="library" aria-pressed="true">作品庫</button><button data-tab="timeline" aria-pressed="false">時間線</button><button id="data">資料管理</button></nav>
<section id="library" tabindex="-1"><div class="toolbar"><h2 id="view-title">我的作品庫</h2><button id="add" class="primary">＋ 新增作品</button></div>
<div class="controls"><input type="search" class="search" id="query" aria-label="搜尋作品、創作者或標籤" placeholder="搜尋作品、創作者或標籤"><select id="type" aria-label="媒介"><option value="">所有媒介</option></select><select id="status" aria-label="狀態"><option value="">所有狀態</option></select><select id="tag" aria-label="標籤"><option value="">所有標籤</option></select><select id="scope" aria-label="收藏範圍"><option value="all">未封存</option><option value="favorite">我的最愛</option><option value="archived">已封存</option></select></div>
<div class="viewbar"><span id="count" role="status"></span><button id="layout">切換為列表</button></div><div id="cards" class="cards"></div></section></main><footer>SHELFMARK　/　私人讀看誌　 ·　v0.1.0</footer><p id="alert" role="status"></p>
<dialog id="backup"><form method="dialog"><div class="toolbar"><h2>資料管理</h2><button value="close" aria-label="關閉資料管理">關閉</button></div></form><p>所有變更只存在這個瀏覽器。完整備份包含私人筆記，不會自動上傳。</p><div class="actions"><button id="export">預覽完整備份</button><button id="share">預覽分享清單</button></div><section id="out" hidden><h3 id="out-title"></h3><pre id="out-preview" tabindex="0"></pre><button id="download">下載 JSON</button></section><hr><label>匯入完整備份（JSON）<input id="file" type="file" accept=".json,application/json"></label><p id="preview" role="status"></p><button id="apply" disabled>確認合併匯入</button><hr><p id="mode-text"></p><button id="mode"></button></dialog>
<script type="module" src="./app.js"></script></body></html>
